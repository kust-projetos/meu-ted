# V4.1 Phase 9 (Task 9.11) — keep third-party Actions on pinned,
# reviewable versions. The `action-pins:check` gate (`pnpm action-pins:check`)
# fails on floating refs (@main/@master/unversioned).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
  # Dependabot security updates consult this ecosystem entry (ignore rules
  # are respected even with version updates disabled via limit 0). sharp
  # stays on a deliberate future-dated pin until 2026-12-31 — allowlisted in
  # pwa-audit + .trivyignore, see docs/security/pwa-audit-risk-acceptance.md
  # — so grouped security PRs must not keep proposing 0.34.5 -> 0.35.x.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "sharp"
