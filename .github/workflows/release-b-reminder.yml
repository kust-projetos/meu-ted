name: Release B Gate Reminder

# V4.1 closure follow-up: reminds the owner to verify the Release B (D11)
# bearer-removal gate once the 14-day legacy_bearer_used window closes on
# 2026-10-02. This workflow NEVER touches production (no SSH, no secrets);
# it only opens a single idempotent reminder issue.
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

# Least privilege: read the repo (checkout) + manage the reminder issue.
permissions:
  contents: read
  issues: write

jobs:
  reminder:
    name: Open Release B gate reminder issue (D11)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open reminder issue once the D11 window closes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const GATE_DATE = '2026-10-15';
            const WINDOW_START = '2026-10-01T20:14:00Z';
            const LABEL = 'release-b-gate';
            const TITLE = 'Release B gate — conferir janela D11-R2 (legacy_bearer_used)';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const today = new Date().toISOString().slice(0, 10);
            core.info(`today=${today} gate=${GATE_DATE}`);
            if (today < GATE_DATE) {
              core.info('D11 window still open — exiting silently, no issue.');
              return;
            }

            // Idempotency: an open issue with the label (or the exact title
            // prefix) means the reminder already exists — update nothing.
            const { data: found } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open label:"${LABEL}"`,
              per_page: 10,
            });
            const alreadyOpen = found.items.some(
              (issue) => issue.title === TITLE || issue.title.startsWith('Release B gate'),
            );
            if (alreadyOpen) {
              core.info('Reminder issue already open — idempotent no-op.');
              return;
            }

            // Ensure the label exists (create it when missing).
            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (error) {
              if (error && error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: LABEL,
                  color: 'B60205',
                  description: 'Release B bearer-removal gate (D11 window)',
                });
                core.info(`Created missing label '${LABEL}'.`);
              } else {
                throw error;
              }
            }

            const body = [
              'A janela D11-R2 do gate Release B fechou em **2026-10-15** (14 dias desde 2026-10-01T20:14Z, reaberta após o sink durável dos PRs #51/#52).',
              'A janela original (gate 2026-10-02) ficou INCONCLUSIVA: o evento só ia para logs pino do container, recriado nos deploys.',
              '',
              '## Consulta read-only na VPS Contabo (somente SELECT; DB canônico, shape canônico)',
              '',
              '**Rodar na Contabo `deploy@<ip-vps-contabo>`** — origem ativa do `pi-financeiro` desde a migração de 2026-10-03 (`docs/reports/2026-10-03-vps-migration-contabo.md`). A Hostinger está CONGELADA no instante do corte e retornaria 0 eventos = falso PASS.',
              '',
              '```sh',
              'docker exec -i pi-finance-postgres psql -U postgres -d pi_financeiro_canonical \\',
              '  -c "SELECT COUNT(*), MIN(created_at), MAX(created_at) FROM audit_logs WHERE event_type = \'auth.request.legacy_bearer_used\' AND created_at >= \'2026-10-01T20:14:00Z\';"',
              '```',
              '',
              '(O evento de 2026-10-01T20:13:42Z é o smoke pré-janela documentado — o filtro acima o exclui.)',
              '',
              '## Critério',
              '',
              '- **0 eventos na janela** → gate PASS, Release B liberada (flip: `SESSION_BEARER_FALLBACK_ENABLED=off` na VPS Contabo + restart; rebuild PWA com `NEXT_PUBLIC_LEGACY_BEARER_COMPAT=off`).',
              '- Qualquer evento reinicia a contagem de 14 dias a partir dele.',
              '',
              '## Referências',
              '',
              '- `CHANGELOG.md` Unreleased 2026-10-01 (seção Release B)',
              '- `docs/reports/v4.1-decision-gates.md` (D11)',
              '',
              '> Aberta automaticamente por `.github/workflows/release-b-reminder.yml` (somente leitura + issue; nenhum acesso à produção).',
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner,
              repo,
              title: TITLE,
              body,
              labels: [LABEL],
            });
            core.info(`Created reminder issue #${issue.number}.`);
