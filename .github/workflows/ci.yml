name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled]

# Least privilege by default; jobs that publish artifacts declare more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Changed-area detection ───────────────────────────────────────────
  # Keeps PR CI small: heavy/financial/docs/policy jobs only run when the
  # matching area changed. The classification lives in
  # scripts/check-changed-areas.mjs (unit-tested) so local and CI agree.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      api: ${{ steps.areas.outputs.api }}
      agent: ${{ steps.areas.outputs.agent }}
      docs: ${{ steps.areas.outputs.docs }}
      governance: ${{ steps.areas.outputs.governance }}
      workflows: ${{ steps.areas.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
          fi
          if ! printf '%s' "$BASE" | grep -Eq '^[0-9a-fA-F]{40}$' || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          node scripts/check-changed-areas.mjs --json --github-output --base "$BASE"

  # ─── Quality ──────────────────────────────────────────────────────────
  quality:
    name: Quality — lint + typecheck + build
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODE_CHANGED: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.agent == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - if: env.CODE_CHANGED == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts (workspace exports resolve dist)
        if: env.CODE_CHANGED == 'true'
        run: pnpm --filter @pi-finance/llm-contracts build

      # Lint/typecheck/build run for backend workspaces only; the PWA is
      # covered by PWA CI (`quality (22, 10)`), so nothing runs twice.
      - if: env.CODE_CHANGED == 'true'
        run: pnpm --filter @pi-finance/llm-contracts --fail-if-no-match lint
      - if: env.CODE_CHANGED == 'true'
        run: pnpm --filter @pi-finance/llm-contracts --fail-if-no-match typecheck
      - if: env.CODE_CHANGED == 'true'
        run: pnpm --filter meu-ted-api --fail-if-no-match lint
      - if: env.CODE_CHANGED == 'true'
        run: pnpm --filter meu-ted-api --fail-if-no-match typecheck
      - if: env.CODE_CHANGED == 'true'
        run: pnpm --filter pi-finance-agent --fail-if-no-match lint
      - if: env.CODE_CHANGED == 'true'
        run: pnpm --filter pi-finance-agent --fail-if-no-match typecheck
      - if: env.CODE_CHANGED == 'true'
        run: pnpm --filter pi-finance-codex-broker --fail-if-no-match lint
      - if: env.CODE_CHANGED == 'true'
        run: pnpm --filter pi-finance-codex-broker --fail-if-no-match typecheck

      - if: env.CODE_CHANGED == 'true'
        run: pnpm --filter meu-ted-api --fail-if-no-match build
      - if: env.CODE_CHANGED == 'true'
        run: pnpm --filter pi-finance-agent --fail-if-no-match build
      - if: env.CODE_CHANGED == 'true'
        run: pnpm --filter pi-finance-codex-broker --fail-if-no-match build

      # Public-safety is fast (fs/git walk) and protects the public repo
      # from secrets/prohibited metadata; it stays on every PR.
      - run: pnpm public-safety --strict

  # ─── TED runtime ────────────────────────────────────────────────────
  # Dedicated coverage for the OpenCode-first runtime slice (ADR-031 P1).
  # Runs on Node 24: the runtime engines field requires >=24 (the SDK uses
  # explicit resource management). Area-gated with the other agent jobs.
  ted-runtime:
    name: TED Runtime — lint + typecheck + test
    needs: [changes]
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pi-finance-ted-runtime --fail-if-no-match lint
      - run: pnpm --filter pi-finance-ted-runtime --fail-if-no-match typecheck
      - run: pnpm --filter pi-finance-ted-runtime --fail-if-no-match test

  # ─── Functional ───────────────────────────────────────────────────────
  # Agent/broker/contract suites run only when that area changed. API
  # behaviour (including financial writes, approvals and idempotency) is
  # covered by postgres-financial below, which is the authoritative API run.
  functional:
    name: Functional — tests + smoke
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build shared contracts (workspace exports resolve dist)
        run: pnpm --filter @pi-finance/llm-contracts build


      # Always-on cheap smoke of the new gates themselves.
      - run: pnpm test:skip-gate
      - run: pnpm test:scripts

      - name: Contracts tests
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.agent == 'true'
        run: pnpm --filter @pi-finance/llm-contracts --fail-if-no-match test

      - name: Agent tests + deterministic eval
        if: needs.changes.outputs.agent == 'true'
        run: |
          pnpm --filter pi-finance-agent --fail-if-no-match test
          pnpm --filter pi-finance-agent --fail-if-no-match eval:ted-v2

      - name: Codex Broker tests
        if: needs.changes.outputs.agent == 'true'
        run: pnpm --filter pi-finance-codex-broker --fail-if-no-match test

  # ─── Financial integrity (Postgres) ───────────────────────────────────
  # Runs when the API, contracts or financial SQL changed. This is the
  # authoritative API suite: unit + approvals + idempotency + integration,
  # financial concurrency and migration validation against real Postgres.
  postgres-financial:
    name: Financial integrity — Postgres
    needs: [changes]
    if: needs.changes.outputs.api == 'true' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-financial'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pi_financeiro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Create disposable database marker
        run: |
          PGPASSWORD=test psql -h localhost -U test -d pi_financeiro_test \
            -c "CREATE TABLE IF NOT EXISTS _test_marker (marker_value TEXT NOT NULL); TRUNCATE _test_marker; INSERT INTO _test_marker(marker_value) VALUES ('00000000-0000-4000-8000-000000000001');"
      - name: Prepare disposable legacy validation database and marker
        run: |
          PGPASSWORD=test psql -h localhost -U test -d postgres \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE pi_financeiro_test_legacy"
          PGPASSWORD=test psql -h localhost -U test -d pi_financeiro_test_legacy \
            -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE _test_marker (marker_value TEXT NOT NULL); INSERT INTO _test_marker(marker_value) VALUES ('00000000-0000-4000-8000-000000000001');"
      - name: Verify both disposable markers before migrations
        run: |
          test "$(PGPASSWORD=test psql -h localhost -U test -d pi_financeiro_test -Atc "SELECT count(*) FROM _test_marker WHERE marker_value = '00000000-0000-4000-8000-000000000001'")" = "1"
          test "$(PGPASSWORD=test psql -h localhost -U test -d pi_financeiro_test_legacy -Atc "SELECT count(*) FROM _test_marker WHERE marker_value = '00000000-0000-4000-8000-000000000001'")" = "1"
      - name: Build shared contracts (workspace exports resolve dist)
        run: pnpm --filter @pi-finance/llm-contracts build
      - name: Apply API migrations to test database
        run: pnpm --filter meu-ted-api db:migrate
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/pi_financeiro_test
      - name: API full suite with Postgres
        run: pnpm --filter meu-ted-api --fail-if-no-match test
        env:
          DATABASE_URL_TEST: postgres://test:test@localhost:5432/pi_financeiro_test
          DB_TEST_MARKER: 00000000-0000-4000-8000-000000000001
          VALIDATION_DATABASE_PROFILE: ci
      - name: API integration suite (all)
        run: pnpm --filter meu-ted-api --fail-if-no-match test:integration:all
        env:
          DATABASE_URL_TEST: postgres://test:test@localhost:5432/pi_financeiro_test
          DB_TEST_MARKER: 00000000-0000-4000-8000-000000000001
      - name: API financial concurrency suite
        run: pnpm --filter meu-ted-api --fail-if-no-match test:concurrency
        env:
          DATABASE_URL_TEST: postgres://test:test@localhost:5432/pi_financeiro_test
          DB_TEST_MARKER: 00000000-0000-4000-8000-000000000001
      - name: Migration validation (read-only)
        run: pnpm --filter meu-ted-api exec tsx src/scripts/migrate.ts --validate
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/pi_financeiro_test

  # ─── Documentation + governance (conditional) ────────────────────────
  docs-policies:
    name: Docs + governance
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.governance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:lint
      - run: pnpm plans:check
      - name: Resolve governance base (fail-closed)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE="$PUSH_BEFORE"
          else
            echo "governance: unsupported event $EVENT_NAME (fail-closed)" >&2
            exit 1
          fi
          if ! printf '%s' "$BASE" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "governance: base is missing or not a 40-hex SHA (fail-closed)" >&2
            exit 1
          fi
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "governance: base is the zero SHA (fail-closed)" >&2
            exit 1
          fi
          echo "GITHUB_BASE_SHA=$BASE" >> "$GITHUB_ENV"
      - run: pnpm governance:check -- --base "$GITHUB_BASE_SHA"
      - run: node --test scripts/lint-docs.test.mjs scripts/check-active-plan-status.test.mjs scripts/canonical-docs-contract.test.mjs scripts/documentation-facts-contract.test.mjs scripts/check-decision-governance.test.mjs

  # ─── Agent policy (conditional) ──────────────────────────────────────
  agent-policy:
    name: Agent policies
    needs: [changes]
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm architecture:check
      - run: pnpm capabilities:check
      - run: pnpm write-policy:check
      - run: node --test scripts/check-agent-v2-invariants.test.mjs scripts/check-tool-capability-inventory.test.mjs scripts/check-write-policy.test.mjs

  # ─── Workflow policy (conditional) ───────────────────────────────────
  workflows-gates:
    name: Workflow pins + YAML
    needs: [changes]
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm action-pins:check
      - run: pnpm workflows-yaml:check
      - run: node --test scripts/check-action-pins.test.mjs scripts/check-workflows-yaml.test.mjs

  # ─── Agent deploy manifest (main only) ───────────────────────────────
  # agent-deploy.yml downloads this artifact; the SHA, run id, lockfile hash
  # and Wrangler version prove the deployed source passed CI.
  agent-manifest:
    name: Agent — deploy manifest (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Write agent deploy manifest (SHA-pinned provenance)
        env:
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p /tmp/agent-manifest
          LOCKFILE_HASH="$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)"
          # pnpm can print workspace engine warnings before the version (e.g.
          # apps/ted-runtime wants node >=24 while CI runs node 22); keep only
          # the last line so the manifest carries the real wrangler version.
          WRANGLER_VERSION="$(pnpm --filter pi-finance-agent --fail-if-no-match exec wrangler --version 2>/dev/null | tail -n 1)"
          GIT_SHA="$GIT_SHA" RUN_ID="$RUN_ID" LOCKFILE_HASH="$LOCKFILE_HASH" WRANGLER_VERSION="$WRANGLER_VERSION" node -e "
          const fs = require('fs');
          const manifest = {
            sha: process.env.GIT_SHA,
            workflow: 'CI',
            runId: process.env.RUN_ID,
            lockfileHash: process.env.LOCKFILE_HASH,
            wranglerVersion: (process.env.WRANGLER_VERSION || '').trim(),
          };
          if (!manifest.lockfileHash || !manifest.wranglerVersion) { console.error('refusing to write incomplete manifest'); process.exit(1); }
          fs.writeFileSync('/tmp/agent-manifest/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          "
          cat /tmp/agent-manifest/manifest.json
      - name: Upload agent deploy manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-deploy-manifest-${{ github.sha }}
          path: /tmp/agent-manifest/manifest.json
          retention-days: 14

  # ─── API image provenance (main only) ────────────────────────────────
  api-image:
    name: API — image digest to GHCR (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.record.outputs.image }}
      digest: ${{ steps.record.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR (built-in GITHUB_TOKEN)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Build API image
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_ID: ${{ github.run_id }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          docker build -f apps/api/Dockerfile \
            --build-arg BUILD_SHA="$BUILD_SHA" \
            --build-arg BUILD_ID="$BUILD_ID" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            -t ghcr.io/$IMAGE_OWNER/meu-ted-api:sha-"$BUILD_SHA" .
      - name: Push by SHA tag and record digest
        id: record
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_ID: ${{ github.run_id }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE="ghcr.io/$IMAGE_OWNER/meu-ted-api"
          TAG="sha-$BUILD_SHA"
          docker push "$IMAGE:$TAG"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$TAG")"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/api-provenance
          IMAGE="$IMAGE" TAG="$TAG" DIGEST="$DIGEST" GIT_SHA="$BUILD_SHA" BUILD_ID="$BUILD_ID" BUILD_TIME="$BUILD_TIME" node -e "
          const fs = require('fs');
          const provenance = {
            image: process.env.IMAGE,
            tag: process.env.TAG,
            digest: process.env.DIGEST,
            gitSha: process.env.GIT_SHA,
            buildId: process.env.BUILD_ID,
            builtAt: process.env.BUILD_TIME,
          };
          if (!provenance.digest) { console.error('refusing to record empty digest'); process.exit(1); }
          fs.writeFileSync('/tmp/api-provenance/api-image-provenance.json', JSON.stringify(provenance, null, 2) + '\n');
          "
          cat /tmp/api-provenance/api-image-provenance.json
      - name: Upload API image provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-image-provenance-${{ github.sha }}
          path: /tmp/api-provenance/api-image-provenance.json
          retention-days: 14

  # ─── Consolidated release manifest (main only) ───────────────────────
  release-manifest:
    name: Release — consolidated manifest (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api-image, agent-manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Download API image provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-image-provenance-${{ github.sha }}
          path: /tmp/release/api
      - name: Download Agent deploy manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-deploy-manifest-${{ github.sha }}
          path: /tmp/release/agent
      - name: Assemble consolidated release manifest
        env:
          GIT_SHA: ${{ github.sha }}
          BUILD_ID: ${{ github.run_id }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          mkdir -p /tmp/release
          GIT_SHA="$GIT_SHA" BUILD_ID="$BUILD_ID" BUILD_TIME="$BUILD_TIME" node -e "
          const fs = require('fs');
          const api = JSON.parse(fs.readFileSync('/tmp/release/api/api-image-provenance.json', 'utf8'));
          const agent = JSON.parse(fs.readFileSync('/tmp/release/agent/manifest.json', 'utf8'));
          const manifest = {
            gitSha: process.env.GIT_SHA,
            buildId: process.env.BUILD_ID,
            builtAt: process.env.BUILD_TIME,
            components: {
              api: { image: api.image, tag: api.tag, digest: api.digest },
              pwa: { artifact: 'pwa-cloudflare-build-pwaci-' + process.env.GIT_SHA },
              agent: { sha: agent.sha, lockfileHash: agent.lockfileHash, wranglerVersion: agent.wranglerVersion, runId: agent.runId },
            },
          };
          fs.writeFileSync('/tmp/release/release-manifest-' + process.env.GIT_SHA + '.json', JSON.stringify(manifest, null, 2) + '\n');
          "
          cat /tmp/release/release-manifest-*.json
      - name: Upload consolidated release manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest-${{ github.sha }}
          path: /tmp/release/release-manifest-*.json
          retention-days: 14

  # ─── Required gate ───────────────────────────────────────────────────
  # Branch protection requires this exact name. Conditional jobs count as
  # passing when skipped; failures still fail the gate.
  gate:
    name: Gate — all checks
    if: always()
    needs: [changes, quality, functional, ted-runtime, postgres-financial, docs-policies, agent-policy, workflows-gates]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required and area jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          QUALITY: ${{ needs.quality.result }}
          FUNCTIONAL: ${{ needs.functional.result }}
          TED_RUNTIME: ${{ needs.ted-runtime.result }}
          POSTGRES: ${{ needs.postgres-financial.result }}
          DOCS: ${{ needs.docs-policies.result }}
          AGENT: ${{ needs.agent-policy.result }}
          WORKFLOWS: ${{ needs.workflows-gates.result }}
        run: |
          set -euo pipefail
          failed=0
          for name in CHANGES QUALITY FUNCTIONAL; do
            value="${!name}"
            if [ "$value" != "success" ]; then
              echo "FAIL: $name=$value"
              failed=1
            fi
          done
          for name in POSTGRES DOCS AGENT WORKFLOWS TED_RUNTIME; do
            value="${!name}"
            case "$value" in
              success|skipped) ;;
              *) echo "FAIL: $name=$value"; failed=1 ;;
            esac
          done
          exit "$failed"
