name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# V4.1 Phase 9 (Task 9.11): least privilege by default; jobs that need more
# (deploy artifact download) declare it per-job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── API ──────────────────────────────────────────────────────────────
  api:
    name: API — lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build shared contracts (workspace exports resolve dist)
        run: pnpm --filter @pi-finance/llm-contracts build
      - name: Contracts - typecheck + test
        run: pnpm --filter @pi-finance/llm-contracts typecheck && pnpm --filter @pi-finance/llm-contracts test
      - run: pnpm --filter meu-ted-api --fail-if-no-match lint
      - run: pnpm --filter meu-ted-api --fail-if-no-match typecheck
      - run: pnpm --filter meu-ted-api --fail-if-no-match test
      - run: pnpm --filter meu-ted-api --fail-if-no-match build

  # ─── Agent ────────────────────────────────────────────────────────────
  agent:
    name: Agent — typecheck + test + deterministic eval + architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build shared contracts (workspace exports resolve dist)
        run: pnpm --filter @pi-finance/llm-contracts build
      - run: pnpm --filter pi-finance-agent --fail-if-no-match lint
      - run: pnpm --filter pi-finance-agent --fail-if-no-match typecheck
      - run: pnpm --filter pi-finance-agent --fail-if-no-match test
      - run: pnpm --filter pi-finance-agent --fail-if-no-match eval:ted-v2
      - run: pnpm architecture:check
      - run: pnpm --filter pi-finance-agent --fail-if-no-match build
      # V4.1 Phase 9 (Task 9.6): SHA-pinned deploy provenance. The Agent has
      # no compiled output (tsc --noEmit; wrangler bundles deterministically
      # at deploy), so CI publishes a manifest proving THIS exact source tree
      # passed CI; agent-deploy.yml refuses to deploy without it.
      # V4.1 closure (SPEC REL-03): manifest carries source SHA, workflow,
      # run id, lockfile hash and wrangler version. agent-deploy.yml
      # verifies every field fail-closed before deploying.
      - name: Write agent deploy manifest (SHA-pinned provenance)
        env:
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p /tmp/agent-manifest
          LOCKFILE_HASH="$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)"
          WRANGLER_VERSION="$(pnpm --filter pi-finance-agent --fail-if-no-match exec wrangler --version)"
          GIT_SHA="$GIT_SHA" RUN_ID="$RUN_ID" LOCKFILE_HASH="$LOCKFILE_HASH" WRANGLER_VERSION="$WRANGLER_VERSION" node -e "
          const fs = require('fs');
          const manifest = {
            sha: process.env.GIT_SHA,
            workflow: 'CI',
            runId: process.env.RUN_ID,
            lockfileHash: process.env.LOCKFILE_HASH,
            wranglerVersion: (process.env.WRANGLER_VERSION || '').trim(),
          };
          if (!manifest.lockfileHash || !manifest.wranglerVersion) { console.error('refusing to write incomplete manifest'); process.exit(1); }
          fs.writeFileSync('/tmp/agent-manifest/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          "
          cat /tmp/agent-manifest/manifest.json
      - name: Upload agent deploy manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-deploy-manifest-${{ github.sha }}
          path: /tmp/agent-manifest/manifest.json
          retention-days: 14

  # ─── Codex Broker ─────────────────────────────────────────────────────
  broker:
    name: Codex Broker — typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pi-finance-codex-broker --fail-if-no-match lint
      - run: pnpm --filter pi-finance-codex-broker --fail-if-no-match typecheck
      - run: pnpm --filter pi-finance-codex-broker --fail-if-no-match test
      - run: pnpm --filter pi-finance-codex-broker --fail-if-no-match build

  # ─── PWA ──────────────────────────────────────────────────────────────
  pwa:
    name: PWA — lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build shared contracts (workspace exports resolve dist)
        run: pnpm --filter @pi-finance/llm-contracts build
      - run: pnpm --filter pwa --fail-if-no-match typecheck
      - run: pnpm --filter pwa --fail-if-no-match lint
      - run: pnpm --filter pwa --fail-if-no-match build
      - run: pnpm --filter pwa --fail-if-no-match test

  # ─── PWA Cloudflare build ─────────────────────────────────────────────
  # Same-SHA Cloudflare build coverage for the main gate (mirrors the
  # build-relevant steps of PWA CI quality). Full E2E stays in PWA CI and
  # is enforced at deploy time by the CI + PWA CI deploy gate.
  pwa-cloudflare:
    name: PWA — Cloudflare build + headers + JS budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build shared contracts (workspace exports resolve dist)
        run: pnpm --filter @pi-finance/llm-contracts build
      # V4.1 Phase 9 (Task 9.9): bake release identity into the bundle so the
      # deployed PWA carries the exact commit it was built from.
      - run: pnpm --dir apps/pwa build:cloudflare
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_ID: ${{ github.run_id }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
      - run: pnpm --dir apps/pwa exec vitest run src/headers.test.ts
      - name: Check initial JS gzip <=200KB
        run: |
          cd apps/pwa
          node -e "
          const z=require('zlib'),fs=require('fs');
          const d='.open-next/assets/_next/static/chunks';
          const files=fs.readdirSync(d).filter(f=>f.endsWith('.js'));
          const init=files.filter(f=>['framework','main-','polyfills'].some(p=>f.startsWith(p)))
            .reduce((s,f)=>{try{return s+z.gzipSync(fs.readFileSync(d+'/'+f)).length}catch{return s}},0);
          console.log('initial JS gzip: '+(init/1024).toFixed(1)+'KB');
          if(init>200*1024){console.log('FAIL: >200KB');process.exit(1)}
          "
      # V4.1 Phase 9 (Task 9.6): build once, store the tested artifact.
      # pwa-deploy.yml downloads THIS tarball and deploys it without rebuilding.
      - name: Pack tested Cloudflare build (SHA-pinned artifact)
        run: tar -czf /tmp/pwa-build-ci.tgz -C apps/pwa .open-next wrangler.jsonc
      - name: Upload PWA Cloudflare build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pwa-cloudflare-build-ci-${{ github.sha }}
          path: /tmp/pwa-build-ci.tgz
          retention-days: 14

  # ─── Postgres integration ────────────────────────────────────────────
  postgres:
    name: Postgres — integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pi_financeiro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Create disposable database marker
        run: |
          PGPASSWORD=test psql -h localhost -U test -d pi_financeiro_test \
            -c "CREATE TABLE IF NOT EXISTS _test_marker (marker_value TEXT NOT NULL); TRUNCATE _test_marker; INSERT INTO _test_marker(marker_value) VALUES ('00000000-0000-4000-8000-000000000001');"
      - run: pnpm --filter meu-ted-api test:integration
        env:
          DATABASE_URL_TEST: postgres://test:test@localhost:5432/pi_financeiro_test
          DB_TEST_MARKER: 00000000-0000-4000-8000-000000000001
      - name: Build shared contracts (workspace exports resolve dist)
        run: pnpm --filter @pi-finance/llm-contracts build
      - name: Apply API migrations to test database
        run: pnpm --filter meu-ted-api db:migrate
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/pi_financeiro_test
      - name: API full suite with Postgres (gated approvals suites enabled)
        run: pnpm --filter meu-ted-api test
        env:
          DATABASE_URL_TEST: postgres://test:test@localhost:5432/pi_financeiro_test
          DB_TEST_MARKER: 00000000-0000-4000-8000-000000000001
      # V4.1 Phase 9 (Tasks 9.1–9.3, 9.5): full integration, financial
      # concurrency, and XLT suites run against this same Postgres.
      - name: API integration suite (all)
        run: pnpm --filter meu-ted-api test:integration:all
        env:
          DATABASE_URL_TEST: postgres://test:test@localhost:5432/pi_financeiro_test
          DB_TEST_MARKER: 00000000-0000-4000-8000-000000000001
      - name: API financial concurrency suite
        run: pnpm --filter meu-ted-api test:concurrency
        env:
          DATABASE_URL_TEST: postgres://test:test@localhost:5432/pi_financeiro_test
          DB_TEST_MARKER: 00000000-0000-4000-8000-000000000001
      - name: API XLT suite
        run: pnpm --filter meu-ted-api test:xlt
        env:
          DATABASE_URL_TEST: postgres://test:test@localhost:5432/pi_financeiro_test
          DB_TEST_MARKER: 00000000-0000-4000-8000-000000000001
      - name: Migration validation (read-only)
        run: pnpm --filter meu-ted-api exec tsx src/scripts/migrate.ts --validate
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/pi_financeiro_test

  # ─── Docker image builds ─────────────────────────────────────────────
  docker:
    name: Docker — API + Codex Broker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # V4.1 Phase 9 (Task 9.9): bake API release identity into the image.
      - name: Build API image
        run: |
          docker build -f apps/api/Dockerfile -t pi-finance-api:ci \
            --build-arg BUILD_SHA=${{ github.sha }} \
            --build-arg BUILD_ID=${{ github.run_id }} \
            --build-arg BUILD_TIME=${{ github.event.head_commit.timestamp }} .
      - name: Build Codex Broker image
        run: docker build -f apps/codex-broker/Dockerfile -t pi-finance-codex-broker:ci .
      - name: Smoke API and Codex Broker containers
        run: pnpm container:smoke
      - name: Container smoke contract (bounded-fetch regression)
        run: node --test scripts/container-smoke.test.mjs

  # ─── API image provenance (V4.1 closure SPEC REL-02) ──────────────────
  # Main pushes only: publishes the API image to GHCR tagged by git SHA
  # and records the immutable digest as a job output + JSON artifact.
  # No VPS deploy automation here — the runbook documents manual
  # digest-based deploy. Least privilege: packages:write on this job only.
  api-image:
    name: API — image digest to GHCR (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.record.outputs.image }}
      digest: ${{ steps.record.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR (built-in GITHUB_TOKEN)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      # Same Dockerfile + release-identity build-args as the `docker` job.
      - name: Build API image
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_ID: ${{ github.run_id }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          docker build -f apps/api/Dockerfile \
            --build-arg BUILD_SHA="$BUILD_SHA" \
            --build-arg BUILD_ID="$BUILD_ID" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            -t ghcr.io/$IMAGE_OWNER/meu-ted-api:sha-"$BUILD_SHA" .
      - name: Push by SHA tag and record digest
        id: record
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_ID: ${{ github.run_id }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE="ghcr.io/$IMAGE_OWNER/meu-ted-api"
          TAG="sha-$BUILD_SHA"
          docker push "$IMAGE:$TAG"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$TAG")"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/api-provenance
          IMAGE="$IMAGE" TAG="$TAG" DIGEST="$DIGEST" GIT_SHA="$BUILD_SHA" BUILD_ID="$BUILD_ID" BUILD_TIME="$BUILD_TIME" node -e "
          const fs = require('fs');
          const provenance = {
            image: process.env.IMAGE,
            tag: process.env.TAG,
            digest: process.env.DIGEST,
            gitSha: process.env.GIT_SHA,
            buildId: process.env.BUILD_ID,
            builtAt: process.env.BUILD_TIME,
          };
          if (!provenance.digest) { console.error('refusing to record empty digest'); process.exit(1); }
          fs.writeFileSync('/tmp/api-provenance/api-image-provenance.json', JSON.stringify(provenance, null, 2) + '\n');
          "
          cat /tmp/api-provenance/api-image-provenance.json
      - name: Upload API image provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-image-provenance-${{ github.sha }}
          path: /tmp/api-provenance/api-image-provenance.json
          retention-days: 14

  # ─── Consolidated release manifest (V4.1 closure SPEC REL-04) ────────
  # Main pushes only, simple version: assembles one release-manifest
  # JSON from the per-app provenance artifacts of this same run.
  # Same-run artifact access uses the job runtime token; no extra
  # permissions beyond the workflow default.
  release-manifest:
    name: Release — consolidated manifest (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api-image, agent, pwa-cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Download API image provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-image-provenance-${{ github.sha }}
          path: /tmp/release/api
      - name: Download Agent deploy manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-deploy-manifest-${{ github.sha }}
          path: /tmp/release/agent
      - name: Assemble consolidated release manifest
        env:
          GIT_SHA: ${{ github.sha }}
          BUILD_ID: ${{ github.run_id }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          mkdir -p /tmp/release
          GIT_SHA="$GIT_SHA" BUILD_ID="$BUILD_ID" BUILD_TIME="$BUILD_TIME" node -e "
          const fs = require('fs');
          const api = JSON.parse(fs.readFileSync('/tmp/release/api/api-image-provenance.json', 'utf8'));
          const agent = JSON.parse(fs.readFileSync('/tmp/release/agent/manifest.json', 'utf8'));
          const manifest = {
            gitSha: process.env.GIT_SHA,
            buildId: process.env.BUILD_ID,
            builtAt: process.env.BUILD_TIME,
            components: {
              api: { image: api.image, tag: api.tag, digest: api.digest },
              pwa: { artifact: 'pwa-cloudflare-build-ci-' + process.env.GIT_SHA },
              agent: { sha: agent.sha, lockfileHash: agent.lockfileHash, wranglerVersion: agent.wranglerVersion, runId: agent.runId },
            },
          };
          fs.writeFileSync('/tmp/release/release-manifest-' + process.env.GIT_SHA + '.json', JSON.stringify(manifest, null, 2) + '\n');
          "
          cat /tmp/release/release-manifest-*.json
      - name: Upload consolidated release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-${{ github.sha }}
          path: /tmp/release/release-manifest-*.json
          retention-days: 14

  # ─── Capability inventory gate ────────────────────────────────────────
  capabilities:
    name: Capability inventory — 72 registered tools classified
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm capabilities:check
      - run: node --test scripts/check-tool-capability-inventory.test.mjs

  # ─── Write/mutator policy gate ───────────────────────────────────────
  write-policy:
    name: Write policy — every mutator has a policy row
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm write-policy:check
      - run: node --test scripts/check-write-policy.test.mjs

  # ─── Governance gate ─────────────────────────────────────────────────
  governance:
    name: Governance — ADR decision gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: |
          if [ -n "$GITHUB_BASE_SHA" ]; then
            pnpm governance:check -- --base "$GITHUB_BASE_SHA"
          else
            pnpm governance:check
          fi
      - run: node --test scripts/check-decision-governance.test.mjs

  # ─── Security gates ───────────────────────────────────────────────────
  security:
    name: Security — secrets + dependencies + containers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:secrets
      - run: pnpm security:deps
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API image for scan
        run: docker build -f apps/api/Dockerfile -t pi-finance-api:ci .
      - name: Build Codex Broker image for scan
        run: docker build -f apps/codex-broker/Dockerfile -t pi-finance-codex-broker:ci .
      - run: pnpm security:containers

  # ─── Documentation gate ──────────────────────────────────────────────
  docs:
    name: Documentation — lint + facts + plans
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:lint
      - run: pnpm plans:check
      - run: node --test scripts/lint-docs.test.mjs scripts/check-active-plan-status.test.mjs scripts/canonical-docs-contract.test.mjs scripts/documentation-facts-contract.test.mjs
      # V4.1 Phase 9 (Tasks 9.4, 9.11): no DB needed.
      - run: pnpm test:skip-gate
      - run: pnpm action-pins:check

  # ─── Public-safety gate (V4.1 closure SPEC §13 / CI-02) ───────────────
  # Authoritative required check: --strict fails on warnings, and the
  # aggregator `gate` job depends on this job. Default (warning-tolerant)
  # mode is no longer sufficient for a green CI.
  public-safety:
    name: Public safety — secrets + prohibited metadata (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: pnpm public-safety --strict

  # ─── Global gate ──────────────────────────────────────────────────────
  gate:
    name: Gate — all checks
    needs: [api, agent, broker, pwa, pwa-cloudflare, postgres, docker, capabilities, write-policy, governance, security, docs, public-safety]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI checks passed."
