name: PWA Deploy

on:
  workflow_run:
    workflows: ["CI", "PWA CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: pwa-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate â€” CI + PWA CI green for SHA
    # SPEC CI-03 (§14): deploys may only follow push-originated CI/PWA CI
    # runs on main. workflow_run events from other triggers (e.g. another
    # workflow_run chain) must never satisfy the deploy gate.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # V4.1 closure (SPEC CI-03): explicit same-repository origin check.
      # Fork-originated workflow_run events must never satisfy the deploy
      # gate, even if every other check below passes.
      - name: Require same-repository origin (fork fail-closed)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          EXPECTED_REPO: ${{ github.repository }}
        with:
          script: |
            const headRepo = process.env.HEAD_REPO;
            const expected = process.env.EXPECTED_REPO;
            core.info(`head_repository=${headRepo} repository=${expected}`);
            if (headRepo !== expected) {
              core.setFailed(`Deploy blocked: workflow_run head_repository '${headRepo}' does not match '${expected}'. Fork-originated runs cannot deploy.`);
              return;
            }
            core.info(`Repository-origin gate passed for ${headRepo}.`);

      - name: Require CI and PWA CI success for the deployed SHA
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const sha = process.env.HEAD_SHA;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              head_sha: sha,
              per_page: 50,
            });
            for (const name of ['CI', 'PWA CI']) {
              const runs = data.workflow_runs.filter((r) => r.name === name);
              if (runs.length === 0) {
                // Fail closed: a missing run for this SHA means the
                // "CI + PWA CI must both succeed" requirement is NOT met
                // (e.g. PWA CI path filters unmatched, or this gate fired on
                // the other workflow's completion before this one finished).
                // The remaining workflow's completion re-triggers this
                // workflow, so the gate passes once both runs exist and are green.
                core.setFailed(`Deploy blocked: no ${name} run found for ${sha}. Re-run ${name} for this SHA before deploying.`);
                return;
              }
              const latest = runs.sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
              core.info(`${name}: latest run #${latest.run_number} conclusion=${latest.conclusion}`);
              if (latest.conclusion !== 'success') {
                core.setFailed(`Deploy blocked: ${name} latest conclusion for ${sha} is '${latest.conclusion}'.`);
                return;
              }
            }
            core.info(`Deploy gate passed for ${sha}.`);

      - name: Reject stale deployment (candidate must equal current main)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const sha = process.env.HEAD_SHA;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            core.info(`candidate=${sha} main=${branch.commit.sha}`);
            if (branch.commit.sha !== sha) {
              core.setFailed(`Deploy blocked: stale SHA ${sha} — main is now ${branch.commit.sha}. Rebase and re-run CI.`);
              return;
            }
            core.info(`Freshness gate passed for ${sha}.`);

  deploy:
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (tooling only — no rebuild below)
        run: pnpm install --frozen-lockfile

      # V4.1 Phase 9 (Task 9.6): build once → store → validate → deploy.
      # The CI-tested tarball (PWA CI preferred, CI fallback — same SHA means
      # same source) is deployed WITHOUT rebuilding in this job.
      - name: Resolve tested build artifact run
        id: artifact-run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const sha = process.env.HEAD_SHA;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, head_sha: sha, per_page: 50,
            });
            // INV-08 (no silent skips): resolve candidates without loop
            // short-circuit — prefer PWA CI, fall back to CI, fail closed
            // when no successful run exists for the deployed SHA.
            const artifactSources = ['PWA CI', 'CI'].map((name) => ({
              name,
              runs: data.workflow_runs
                .filter((r) => r.name === name && r.conclusion === 'success')
                .sort((a, b) => b.created_at.localeCompare(a.created_at)),
            }));
            const resolved = artifactSources.find((source) => source.runs.length > 0);
            if (!resolved) {
              core.setFailed(`Deploy blocked: no successful CI/PWA CI run found for ${sha}.`);
              return;
            }
            core.info(`Using ${resolved.name} run #${resolved.runs[0].run_number} (id=${resolved.runs[0].id}).`);
            core.setOutput('run_id', String(resolved.runs[0].id));
            core.setOutput('source', resolved.name === 'PWA CI' ? 'pwaci' : 'ci');

      - name: Download tested build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pwa-cloudflare-build-${{ steps.artifact-run.outputs.source }}-${{ github.event.workflow_run.head_sha }}
          path: /tmp/pwa-artifact
          run-id: ${{ steps.artifact-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tested build (no rebuild)
        run: tar -xzf /tmp/pwa-artifact/pwa-build-*.tgz -C apps/pwa && ls apps/pwa/.open-next/worker.js

      # DEBT2-CODER-ALLOWLISTS-FIX (shell-injection hardening): repo
      # variables enter ONLY via step `env:` below — never interpolated into
      # `run:` text. The helper URL-parses each value, pins it to the exact
      # expected production host (rejecting empty/non-https/userinfo/
      # path/query/fragment/wrong-host), and persists ONLY the sanitized
      # canonical origin to $GITHUB_ENV for the deploy step.
      - name: Validate prod-origin repo variables (fail closed)
        env:
          PWA_PROD_URL: ${{ vars.PWA_PROD_URL }}
          AGENT_PROD_URL: ${{ vars.AGENT_PROD_URL }}
        run: |
          node scripts/validate-deploy-origins.mjs --name PWA_PROD_URL --expect pwa --env-file "$GITHUB_ENV"
          node scripts/validate-deploy-origins.mjs --name AGENT_PROD_URL --expect agent --env-file "$GITHUB_ENV"

      - name: Deploy tested artifact to Cloudflare Workers
        run: pnpm --dir apps/pwa exec wrangler deploy --var "PWA_ORIGIN:$PWA_PROD_URL" --var "PWA_AGENT_PROXY_ORIGIN:$AGENT_PROD_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    name: Post-deploy smoke (read-only)
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PWA_PROD_URL: ${{ vars.PWA_PROD_URL }}
      API_PROD_URL: https://api.synkroo.com.br
    steps:
      - name: Checkout deployed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # DEBT2-CODER-SMOKE-URL-FIX: validate BEFORE any curl. The repo
      # variable enters ONLY via step `env:` below — never interpolated
      # into `run:` text. The helper pins it to the exact expected PWA host
      # (empty/non-https/userinfo/path/query/fragment/wrong-host all fail
      # closed) and persists the canonical origin to $GITHUB_ENV, so every
      # smoke curl uses the validated value. (If unset: gh variable set
      # PWA_PROD_URL --body "https://<pwa-host>".)
      - name: Validate PWA_PROD_URL (fail closed)
        env:
          PWA_PROD_URL: ${{ vars.PWA_PROD_URL }}
        run: |
          node scripts/validate-deploy-origins.mjs --name PWA_PROD_URL --expect pwa --env-file "$GITHUB_ENV"

      - name: PWA root serves HTTP 200 (public GET only)
        run: |
          curl -fsS -o /dev/null -w "%{http_code}\n" "$PWA_PROD_URL/"

      - name: API health serves HTTP 200 (public GET only)
        run: |
          curl -fsS "$API_PROD_URL/health"

      - name: Install Playwright browser
        run: pnpm --dir apps/pwa exec playwright install --with-deps chromium

      # Same read-only production-smoke logic as production-smoke.yml
      # (SMOKE-01..04: unauthenticated registration shell, GET/HEAD/OPTIONS
      # only — the spec fails closed on any emitted write), pinned to the
      # deployed SHA. Fails this workflow when the smoke fails.
      # V4.1 Phase 9 (Task 9.10): SMOKE-05 confirms /api/build-info gitSha
      # equals the deployed SHA via EXPECTED_SHA.
      - name: Run read-only smoke against deployed URL
        env:
          E2E_PRODUCTION_SMOKE: "1"
          E2E_PRODUCTION_URL: ${{ env.PWA_PROD_URL }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: pnpm --dir apps/pwa exec playwright test --config=e2e/playwright.config.ts --project=production-smoke --workers=1 --retries=0
