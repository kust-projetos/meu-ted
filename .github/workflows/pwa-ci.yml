name: PWA CI

on:
  push:
    branches: [main]
    # No path filters: the deploy gate (agent-deploy/pwa-deploy) requires a
    # PWA CI run for EVERY main SHA and branch protection requires
    # "quality (22, 10)" on EVERY pull request.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check: "quality (22, 10)". Keep the job id + matrix intact so
  # branch protection keeps matching without a settings change.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [10]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ matrix.pnpm-version }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint PWA
        run: pnpm --dir apps/pwa lint

      - name: Build shared contracts (workspace exports resolve dist)
        run: pnpm --filter @pi-finance/llm-contracts build

      - name: Typecheck PWA
        run: pnpm --dir apps/pwa typecheck

      - name: PWA command boundary
        run: pnpm boundary:check

      - name: Build PWA (Cloudflare)
        run: pnpm --dir apps/pwa build:cloudflare
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_ID: ${{ github.run_id }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          # Release B (D11-R2, gate PASS 2026-11-11): janela de compat do
          # bearer legado fechada. O boot limpa tokens órfãos e o bearer de
          # sessão legado não é mais aceito pela API (SESSION_BEARER_FALLBACK_OFF).
          NEXT_PUBLIC_LEGACY_BEARER_COMPAT: "off"
          # V1-textual: sem flags multimodais no build publicado - defaults fail-closed; PDF segue OFF.

      - name: Boot the generated Worker (Cloudflare 1101 guard)
        # Regression guard for the PR #274 incident (Cloudflare 1101 on every
        # route after deploy): a successful Next build + unit tests do NOT
        # prove the packaged Worker can start. Boot the EXACT .open-next
        # artifact on the local workerd and require a real HTTP answer from a
        # public route before the artifact is packed for deploy.
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          cd apps/pwa
          PORT=8787
          LOG="$RUNNER_TEMP/wrangler-dev.log"
          pnpm exec wrangler dev --port "$PORT" --ip 127.0.0.1 >"$LOG" 2>&1 &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          ok=0
          code=""
          for _ in $(seq 1 90); do
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 "http://127.0.0.1:$PORT/" || true)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Worker did not boot or did not answer 200 on / (last status: ${code:-none})"
            tail -n 80 "$LOG" || true
            exit 1
          fi
          echo "Worker boot OK (HTTP 200 on /)"

      - name: Pack tested Cloudflare build (SHA-pinned artifact)
        run: tar -czf /tmp/pwa-build-pwaci.tgz -C apps/pwa .open-next wrangler.jsonc

      - name: Upload PWA Cloudflare build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwa-cloudflare-build-pwaci-${{ github.sha }}
          path: /tmp/pwa-build-pwaci.tgz
          retention-days: 14

      # The TED P2 real-history probe runs the OpenCode SDK 2.2.4, which needs
      # Node >= 24 (explicit resource management). Fetch a PINNED Node 24 with a
      # verified SHA256 and expose it via TED_PROBE_NODE; PATH stays on Node 22.
      - name: Fetch pinned Node 24 for the TED runtime probe
        run: |
          set -euo pipefail
          VERSION=v24.22.2
          DIR="$RUNNER_TEMP/node-probe"
          mkdir -p "$DIR"
          curl -fsSL -o "$DIR/node-$VERSION-linux-x64.tar.xz" "https://nodejs.org/dist/$VERSION/node-$VERSION-linux-x64.tar.xz"
          curl -fsSL -o "$DIR/SHASUMS256.txt" "https://nodejs.org/dist/$VERSION/SHASUMS256.txt"
          (cd "$DIR" && grep -F "  node-$VERSION-linux-x64.tar.xz" SHASUMS256.txt | sha256sum -c -)
          tar -xJf "$DIR/node-$VERSION-linux-x64.tar.xz" -C "$DIR" --strip-components=1
          echo "TED_PROBE_NODE=$DIR/bin/node" >> "$GITHUB_ENV"
          "$DIR/bin/node" -v

      - name: Test PWA
        run: pnpm --dir apps/pwa exec vitest run

      - name: Validate _headers propagation
        run: pnpm --dir apps/pwa exec vitest run src/headers.test.ts

      - name: Check initial JS gzip <=200KB
        run: |
          cd apps/pwa
          node -e "
          const z=require('zlib'),fs=require('fs');
          const d='.open-next/assets/_next/static/chunks';
          const files=fs.readdirSync(d).filter(f=>f.endsWith('.js'));
          const init=files.filter(f=>['framework','main-','polyfills'].some(p=>f.startsWith(p)))
            .reduce((s,f)=>{try{return s+z.gzipSync(fs.readFileSync(d+'/'+f)).length}catch{return s}},0);
          console.log('initial JS gzip: '+(init/1024).toFixed(1)+'KB');
          if(init>200*1024){console.log('FAIL: >200KB');process.exit(1)}
          "

  # Full E2E is expensive: runs on main and on demand (label `run-full-e2e`
  # on a PR), never on every pull request.
  e2e:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-full-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [10]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ matrix.pnpm-version }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # The runner image normally needs the extra OS packages, but a broken
        # apt mirror/DNS must not fail the whole E2E job before the browser is
        # even installed: fall back to the browser-only install, which is
        # enough on images that already carry the Chromium runtime libs.
        run: |
          pnpm --dir apps/pwa exec playwright install --with-deps chromium \
            || pnpm --dir apps/pwa exec playwright install chromium

      - name: Run matrix gate
        run: pnpm --dir apps/pwa exec tsx --test e2e/support/matrix.test.ts

      - name: Build shared contracts (workspace exports resolve dist)
        run: pnpm --filter @pi-finance/llm-contracts build

      - name: Run comprehensive E2E
        run: bash apps/pwa/e2e/run-ci.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: apps/pwa/test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/pwa/test-results/report-*/
          retention-days: 7
