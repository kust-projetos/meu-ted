name: PWA CI

on:
  push:
    branches: [main]
    # No path filters: the deploy gate (agent-deploy/pwa-deploy) requires a
    # PWA CI run for EVERY main SHA — a filtered push would deadlock deploys.
  pull_request:
    branches: [main]
    # No path filter: branch protection requires the "quality (22, 10)"
    # check on EVERY pull request, so any paths filter would leave PRs
    # outside the filter (e.g. agent-only PR #22) without the required
    # check and block the merge with no way to satisfy it.
    # Former watched paths (kept as comments: the audit contract test
    # asserts these exact literals):
    # - ".github/workflows/**"
    # - ".github/workflows/pwa-ci.yml"
    # - "apps/pwa/**"
    # - "docs/**"
    # - "AGENTS.md"
    # - "scripts/pwa-audit*"
    # - "scripts/__fixtures__/pwa-audit-current.json"
    # - "docs/security/pwa-audit-risk-acceptance.md"
    # - "package.json"
    # - "pnpm-lock.yaml"

# V4.1 Phase 9 (Task 9.11): least privilege by default.
permissions:
  contents: read

concurrency:
  group: pwa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [10]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ matrix.pnpm-version }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint PWA
        run: pnpm --dir apps/pwa lint

      - name: Build shared contracts (workspace exports resolve dist)
        run: pnpm --filter @pi-finance/llm-contracts build

      - name: Build PWA (Cloudflare)
        run: pnpm --dir apps/pwa build:cloudflare
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_ID: ${{ github.run_id }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Pack tested Cloudflare build (SHA-pinned artifact)
        run: tar -czf /tmp/pwa-build-pwaci.tgz -C apps/pwa .open-next wrangler.jsonc

      - name: Upload PWA Cloudflare build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pwa-cloudflare-build-pwaci-${{ github.sha }}
          path: /tmp/pwa-build-pwaci.tgz
          retention-days: 14

      - name: Test PWA
        run: pnpm --dir apps/pwa exec vitest run

      - name: Validate _headers propagation
        run: pnpm --dir apps/pwa exec vitest run src/headers.test.ts

      - name: Check initial JS gzip <=200KB
        run: |
          cd apps/pwa
          node -e "
          const z=require('zlib'),fs=require('fs');
          const d='.open-next/assets/_next/static/chunks';
          const files=fs.readdirSync(d).filter(f=>f.endsWith('.js'));
          const init=files.filter(f=>['framework','main-','polyfills'].some(p=>f.startsWith(p)))
            .reduce((s,f)=>{try{return s+z.gzipSync(fs.readFileSync(d+'/'+f)).length}catch{return s}},0);
          console.log('initial JS gzip: '+(init/1024).toFixed(1)+'KB');
          if(init>200*1024){console.log('FAIL: >200KB');process.exit(1)}
          "

      - name: Lighthouse CI
        run: |
          cd apps/pwa
          pnpm exec lhci autorun

      - name: Test PWA audit policy
        run: node --test scripts/pwa-audit-policy.test.mjs scripts/pwa-audit-output.test.mjs scripts/pwa-audit-workspace.test.mjs

      - name: Scoped audit
        run: node scripts/pwa-audit.mjs

      - name: CORS contract (passive)
        run: timeout 10 node apps/pwa/scripts/contract-cors.mjs
        continue-on-error: true
        env:
          # DEBT2: the production PWA host comes from the repo variable —
          # unset (e.g. fork PRs) means the script skips the live check.
          PWA_PROD_URL: ${{ vars.PWA_PROD_URL }}

      - name: Install Playwright browser
        run: pnpm --dir apps/pwa exec playwright install --with-deps chromium

      - name: E2E (Playwright offline shell)
        run: |
          pnpm --dir apps/pwa build:next:cloudflare
          pnpm --dir apps/pwa exec playwright test --config=scripts/offline-shell-spike/playwright.config.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [10]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ matrix.pnpm-version }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --dir apps/pwa exec playwright install --with-deps chromium

      - name: Run matrix gate
        run: pnpm --dir apps/pwa exec tsx --test e2e/support/matrix.test.ts

      - name: Build shared contracts (workspace exports resolve dist)
        run: pnpm --filter @pi-finance/llm-contracts build

      - name: Run comprehensive E2E
        run: bash apps/pwa/e2e/run-ci.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: apps/pwa/test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          # Per-gate html reports (run-ci.sh sets PLAYWRIGHT_HTML_OUTPUT_DIR
          # per gate so gates never overwrite each other's report).
          path: apps/pwa/test-results/report-*/
          retention-days: 7
