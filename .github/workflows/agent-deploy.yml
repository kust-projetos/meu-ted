name: Agent Deploy

on:
  workflow_dispatch:

concurrency:
  group: agent-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate — CI + PWA CI green for SHA
    # Only a manually started run on main can deploy.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      deploy_ready: ${{ steps.checks.outputs.deploy_ready }}
    steps:
      - name: Require CI and PWA CI success for the deployed SHA
        id: checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.sha }}
        with:
          script: |
            const sha = process.env.HEAD_SHA;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              head_sha: sha,
              per_page: 50,
            });
            for (const name of ['CI', 'PWA CI']) {
              const runs = data.workflow_runs.filter((r) => r.name === name);
              if (runs.length === 0) {
                // Fail closed: a missing run for this SHA means the
                // "CI + PWA CI must both succeed" requirement is NOT met
                // (e.g. PWA CI path filters unmatched, or the run was never
                // created). A run that exists but is still in progress is a
                // different case, handled by the not-ready skip below — this
                // check is never relaxed to accommodate it.
                core.setFailed(`Deploy blocked: no ${name} run found for ${sha}. Re-run ${name} for this SHA before deploying.`);
                return;
              }
              const latest = runs.sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
              core.info(`${name}: latest run #${latest.run_number} status=${latest.status} conclusion=${latest.conclusion}`);
              // A manual deploy requires both CI runs to be complete.
              if (latest.status !== 'completed' || latest.conclusion == null) {
                core.setFailed(`Deploy blocked: ${name} run #${latest.run_number} is not complete for ${sha}.`);
                return;
              }
              if (latest.conclusion !== 'success') {
                core.setFailed(`Deploy blocked: ${name} latest conclusion for ${sha} is '${latest.conclusion}'.`);
                return;
              }
            }
            core.setOutput('deploy_ready', 'true');
            core.info(`Deploy gate passed for ${sha}.`);

      - name: Reject stale deployment (candidate must equal current main)
        if: steps.checks.outputs.deploy_ready == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.sha }}
        with:
          script: |
            const sha = process.env.HEAD_SHA;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            core.info(`candidate=${sha} main=${branch.commit.sha}`);
            if (branch.commit.sha !== sha) {
              core.setFailed(`Deploy blocked: stale SHA ${sha} — main is now ${branch.commit.sha}. Rebase and re-run CI.`);
              return;
            }
            core.info(`Freshness gate passed for ${sha}.`);

  deploy:
    needs: [gate]
    if: needs.gate.result == 'success' && needs.gate.outputs.deploy_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout approved SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # wrangler bundles @pi-finance/llm-contracts from its `dist` exports —
      # build the shared contracts exactly like the CI agent job does, or the
      # bundler fails with "Could not resolve @pi-finance/llm-contracts".
      - name: Build shared contracts (workspace exports resolve dist)
        run: pnpm --filter @pi-finance/llm-contracts build
      # V4.1 Phase 9 (Task 9.6): same-source proof. The Agent has no compiled
      # output (tsc --noEmit; wrangler bundles deterministically from pinned
      # deps at deploy), so CI publishes a SHA-pinned manifest proving THIS
      # exact source passed CI; this job refuses to deploy without it.
      # T11a FATIA 1: the comparison below is same-installation identity —
      # the lockfile hash and Wrangler version are recomputed from THIS
      # checkout/installation (not a global install) and must match the
      # manifest after version normalization.
      - name: Capture local build identity (same installation as deploy)
        id: local-identity
        run: |
          LOCKFILE_HASH="$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)"
          # pnpm can print workspace engine warnings before the version (e.g.
          # apps/ted-runtime wants node >=24 while the runner uses node 22);
          # keep only the last line so $GITHUB_OUTPUT carries the real version.
          WRANGLER_VERSION="$(pnpm --filter pi-finance-agent --fail-if-no-match exec wrangler --version 2>/dev/null | tail -n 1)"
          echo "lockfile-hash=$LOCKFILE_HASH" >> "$GITHUB_OUTPUT"
          echo "wrangler-version=$WRANGLER_VERSION" >> "$GITHUB_OUTPUT"
      - name: Resolve CI manifest run for the approved SHA
        id: manifest-run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.sha }}
        with:
          script: |
            const sha = process.env.HEAD_SHA;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, head_sha: sha, per_page: 50,
            });
            const runs = data.workflow_runs
              .filter((r) => r.name === 'CI' && r.conclusion === 'success')
              .sort((a, b) => b.created_at.localeCompare(a.created_at));
            if (runs.length === 0) {
              core.setFailed(`Deploy blocked: no successful CI run found for ${sha}.`);
              return;
            }
            core.info(`Using CI run #${runs[0].run_number} (id=${runs[0].id}).`);
            core.setOutput('run_id', String(runs[0].id));
      - name: Download CI manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-deploy-manifest-${{ github.sha }}
          path: /tmp/agent-manifest
          run-id: ${{ steps.manifest-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify manifest identity matches this installation (fail closed)
        env:
          HEAD_SHA: ${{ github.sha }}
          LOCAL_LOCKFILE_HASH: ${{ steps.local-identity.outputs.lockfile-hash }}
          LOCAL_WRANGLER_VERSION: ${{ steps.local-identity.outputs.wrangler-version }}
          MANIFEST_RUN_ID: ${{ steps.manifest-run.outputs.run_id }}
        run: |
          node scripts/validate-deploy-manifest.mjs --manifest /tmp/agent-manifest/manifest.json --sha "$HEAD_SHA" --lockfile-hash "$LOCAL_LOCKFILE_HASH" --wrangler-version "$LOCAL_WRANGLER_VERSION" --run-id "$MANIFEST_RUN_ID"
      # DEBT2-CODER-ALLOWLISTS-FIX (shell-injection hardening): the repo
      # variable enters ONLY via step `env:` below — never interpolated into
      # `run:` text. The helper pins it to the exact expected PWA host and
      # persists ONLY the sanitized canonical origin to $GITHUB_ENV.
      - name: Validate PWA_PROD_URL repo variable (fail closed)
        env:
          PWA_PROD_URL: ${{ vars.PWA_PROD_URL }}
        run: |
          node scripts/validate-deploy-origins.mjs --name PWA_PROD_URL --expect pwa --env-file "$GITHUB_ENV"
      - name: Deploy Agent Worker (source verified, no independent rebuild)
        run: pnpm --dir apps/agent exec wrangler deploy --var BUILD_SHA:${{ github.sha }} --var BUILD_ID:${{ github.run_id }} --var BUILD_TIME:$(date -u +%Y-%m-%dT%H:%M:%SZ) --var "PWA_ORIGIN:$PWA_PROD_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    name: Post-deploy smoke (read-only)
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AGENT_PROD_URL: ${{ vars.AGENT_PROD_URL }}
      API_PROD_URL: https://api.synkroo.com.br
    steps:
      - name: Checkout deployed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      # DEBT2-CODER-SMOKE-URL-FIX: validate BEFORE any curl (runner-provided
      # node is enough — the helper has no dependencies). The repo variable
      # enters ONLY via step `env:` below; the helper pins it to the exact
      # expected Agent host and persists the canonical origin to $GITHUB_ENV,
      # so every smoke curl uses the validated value. (If unset:
      # gh variable set AGENT_PROD_URL --body "https://<agent-host>".)
      - name: Validate AGENT_PROD_URL (fail closed)
        env:
          AGENT_PROD_URL: ${{ vars.AGENT_PROD_URL }}
        run: |
          node scripts/validate-deploy-origins.mjs --name AGENT_PROD_URL --expect agent --env-file "$GITHUB_ENV"
      - name: Agent worker health (public GET only)
        run: |
          curl -fsS "$AGENT_PROD_URL/health" | grep -q '"status":"ready"'
          curl -fsS "$AGENT_PROD_URL/health/agent" | grep -q '"status":"ready"'
      # V4.1 Phase 9 (Task 9.10): the deployed worker must report the SHA
      # this workflow deployed — fail closed on mismatch. Bounded retry
      # (issue #96): Workers version propagation is eventually consistent,
      # so a single curl can observe the previous SHA right after deploy; a
      # genuine mismatch still fails after the budget runs out.
      - name: Agent release identity matches deployed SHA (bounded propagation retry)
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/agent-release-smoke.mjs --url "$AGENT_PROD_URL" --expected-sha "$EXPECTED_SHA"
      - name: API health (public GET only)
        run: |
          curl -fsS "$API_PROD_URL/health"

  attest:
    name: Attestation — ATTESTED vs NOT-ATTESTED (fail-closed, §5.6)
    # Record outcome of this manual deployment and smoke test.
    needs: [gate, deploy, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: none
    outputs:
      attestation: ${{ steps.verdict.outputs.attestation }}
      reason: ${{ steps.verdict.outputs.reason }}
    steps:
      - name: Compute deployment attestation (records only, never deploys)
        id: verdict
        env:
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          GATE_RESULT: ${{ needs.gate.result }}
          DEPLOY_READY: ${{ needs.gate.outputs.deploy_ready }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          node -e "
          const fs = require('fs');
          const gate = process.env.GATE_RESULT || 'unknown';
          const ready = process.env.DEPLOY_READY || '';
          const deploy = process.env.DEPLOY_RESULT || 'unknown';
          const smoke = process.env.SMOKE_RESULT || 'unknown';
          const sha = process.env.HEAD_SHA || 'unknown';
          const runId = process.env.WORKFLOW_RUN_ID || 'unknown';
          let attestation = 'NOT-ATTESTED';
          let reason = 'unknown';
          if (gate !== 'success') { reason = 'gate-not-success:' + gate; }
          else if (ready !== 'true') { reason = 'deploy-skipped:gate-not-ready'; }
          else if (deploy === 'skipped') { reason = 'deploy-skipped'; }
          else if (deploy !== 'success') { reason = 'deploy-' + deploy; }
          else if (smoke === 'skipped') { reason = 'smoke-skipped'; }
          else if (smoke !== 'success') { reason = 'smoke-' + smoke; }
          else { attestation = 'ATTESTED'; reason = 'deploy-smoke-pass'; }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'attestation=' + attestation + '\nreason=' + reason + '\n');
          const lines = [
            '## Deployment attestation: ' + attestation,
            '',
            '- sha: ' + sha,
            '- buildId (manual-run-id): ' + runId,
            '- reason: ' + reason,
            '- gate: ' + gate + ' deploy_ready: ' + (ready || '(empty)') + ' deploy: ' + deploy + ' smoke: ' + smoke,
            '',
            attestation === 'ATTESTED'
              ? 'Deploy ran and smoke PASSED for this sha. This is the ONLY state that constitutes a release.'
              : 'NOT DEPLOYED (fail-closed): a green workflow with a skipped deploy/smoke is NOT a release. Only attestation=ATTESTED with a matching sha counts — check the attestation/reason job outputs, never the workflow status alone.',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          console.log('attestation=' + attestation + ' reason=' + reason + ' sha=' + sha + ' buildId=' + runId);
          "
