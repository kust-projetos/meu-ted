name: Agent Deploy

on:
  workflow_run:
    workflows: ["CI", "PWA CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: agent-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate — CI + PWA CI green for SHA
    # SPEC CI-03 (§14): deploys may only follow push-originated CI/PWA CI
    # runs on main. workflow_run events from other triggers (e.g. another
    # workflow_run chain) must never satisfy the deploy gate.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # V4.1 closure (SPEC CI-03): explicit same-repository origin check.
      # Fork-originated workflow_run events must never satisfy the deploy
      # gate, even if every other check below passes.
      - name: Require same-repository origin (fork fail-closed)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          EXPECTED_REPO: ${{ github.repository }}
        with:
          script: |
            const headRepo = process.env.HEAD_REPO;
            const expected = process.env.EXPECTED_REPO;
            core.info(`head_repository=${headRepo} repository=${expected}`);
            if (headRepo !== expected) {
              core.setFailed(`Deploy blocked: workflow_run head_repository '${headRepo}' does not match '${expected}'. Fork-originated runs cannot deploy.`);
              return;
            }
            core.info(`Repository-origin gate passed for ${headRepo}.`);

      - name: Require CI and PWA CI success for the deployed SHA
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const sha = process.env.HEAD_SHA;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              head_sha: sha,
              per_page: 50,
            });
            for (const name of ['CI', 'PWA CI']) {
              const runs = data.workflow_runs.filter((r) => r.name === name);
              if (runs.length === 0) {
                // Fail closed: a missing run for this SHA means the
                // "CI + PWA CI must both succeed" requirement is NOT met
                // (e.g. PWA CI path filters unmatched, or this gate fired on
                // the other workflow's completion before this one finished).
                // The remaining workflow's completion re-triggers this
                // workflow, so the gate passes once both runs exist and are green.
                core.setFailed(`Deploy blocked: no ${name} run found for ${sha}. Re-run ${name} for this SHA before deploying.`);
                return;
              }
              const latest = runs.sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
              core.info(`${name}: latest run #${latest.run_number} conclusion=${latest.conclusion}`);
              if (latest.conclusion !== 'success') {
                core.setFailed(`Deploy blocked: ${name} latest conclusion for ${sha} is '${latest.conclusion}'.`);
                return;
              }
            }
            core.info(`Deploy gate passed for ${sha}.`);

      - name: Reject stale deployment (candidate must equal current main)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const sha = process.env.HEAD_SHA;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            core.info(`candidate=${sha} main=${branch.commit.sha}`);
            if (branch.commit.sha !== sha) {
              core.setFailed(`Deploy blocked: stale SHA ${sha} — main is now ${branch.commit.sha}. Rebase and re-run CI.`);
              return;
            }
            core.info(`Freshness gate passed for ${sha}.`);

  deploy:
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout approved SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # wrangler bundles @pi-finance/llm-contracts from its `dist` exports —
      # build the shared contracts exactly like the CI agent job does, or the
      # bundler fails with "Could not resolve @pi-finance/llm-contracts".
      - name: Build shared contracts (workspace exports resolve dist)
        run: pnpm --filter @pi-finance/llm-contracts build
      # V4.1 Phase 9 (Task 9.6): same-source proof. The Agent has no compiled
      # output (tsc --noEmit; wrangler bundles deterministically from pinned
      # deps at deploy), so CI publishes a SHA-pinned manifest proving THIS
      # exact source passed CI; deploy refuses to proceed without it.
      - name: Resolve CI manifest run for the approved SHA
        id: manifest-run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const sha = process.env.HEAD_SHA;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, head_sha: sha, per_page: 50,
            });
            const runs = data.workflow_runs
              .filter((r) => r.name === 'CI' && r.conclusion === 'success')
              .sort((a, b) => b.created_at.localeCompare(a.created_at));
            if (runs.length === 0) {
              core.setFailed(`Deploy blocked: no successful CI run found for ${sha}.`);
              return;
            }
            core.info(`Using CI run #${runs[0].run_number} (id=${runs[0].id}).`);
            core.setOutput('run_id', String(runs[0].id));
      - name: Download CI manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-deploy-manifest-${{ github.event.workflow_run.head_sha }}
          path: /tmp/agent-manifest
          run-id: ${{ steps.manifest-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify manifest SHA matches the approved SHA
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node -e "
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('/tmp/agent-manifest/manifest.json', 'utf8'));
          if (m.sha !== process.env.HEAD_SHA) { console.error('manifest sha mismatch: ' + m.sha); process.exit(1); }
          if (!m.lockfileHash || typeof m.lockfileHash !== 'string') { console.error('manifest missing lockfileHash — refusing to deploy'); process.exit(1); }
          if (!m.wranglerVersion || typeof m.wranglerVersion !== 'string' || m.wranglerVersion.trim() === '') { console.error('manifest missing wranglerVersion — refusing to deploy'); process.exit(1); }
          console.log('manifest verified for ' + m.sha + ' lockfileHash=' + m.lockfileHash + ' wrangler=' + m.wranglerVersion);
          "
      # DEBT2-CODER-ALLOWLISTS-FIX (shell-injection hardening): the repo
      # variable enters ONLY via step `env:` below — never interpolated into
      # `run:` text. The helper pins it to the exact expected PWA host and
      # persists ONLY the sanitized canonical origin to $GITHUB_ENV.
      - name: Validate PWA_PROD_URL repo variable (fail closed)
        env:
          PWA_PROD_URL: ${{ vars.PWA_PROD_URL }}
        run: |
          node scripts/validate-deploy-origins.mjs --name PWA_PROD_URL --expect pwa --env-file "$GITHUB_ENV"
      - name: Deploy Agent Worker (source verified, no independent rebuild)
        run: pnpm --dir apps/agent exec wrangler deploy --var BUILD_SHA:${{ github.event.workflow_run.head_sha }} --var BUILD_ID:${{ github.event.workflow_run.id }} --var BUILD_TIME:${{ github.event.workflow_run.created_at }} --var "PWA_ORIGIN:$PWA_PROD_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    name: Post-deploy smoke (read-only)
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AGENT_PROD_URL: ${{ vars.AGENT_PROD_URL }}
      API_PROD_URL: https://api.synkroo.com.br
    steps:
      - name: Checkout deployed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # DEBT2-CODER-SMOKE-URL-FIX: validate BEFORE any curl (runner-provided
      # node is enough — the helper has no dependencies). The repo variable
      # enters ONLY via step `env:` below; the helper pins it to the exact
      # expected Agent host and persists the canonical origin to $GITHUB_ENV,
      # so every smoke curl uses the validated value. (If unset:
      # gh variable set AGENT_PROD_URL --body "https://<agent-host>".)
      - name: Validate AGENT_PROD_URL (fail closed)
        env:
          AGENT_PROD_URL: ${{ vars.AGENT_PROD_URL }}
        run: |
          node scripts/validate-deploy-origins.mjs --name AGENT_PROD_URL --expect agent --env-file "$GITHUB_ENV"
      - name: Agent worker health (public GET only)
        run: |
          curl -fsS "$AGENT_PROD_URL/health" | grep -q '"status":"ready"'
          curl -fsS "$AGENT_PROD_URL/health/agent" | grep -q '"status":"ready"'
      # V4.1 Phase 9 (Task 9.10): the deployed worker must report the SHA
      # this workflow deployed — fail closed on mismatch.
      - name: Agent release identity matches deployed SHA
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          curl -fsS "$AGENT_PROD_URL/health" | grep -q "\"buildSha\":\"$EXPECTED_SHA\""
      - name: API health (public GET only)
        run: |
          curl -fsS "$API_PROD_URL/health"
