name: Production smoke

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: "Already deployed PWA URL (read-only smoke target)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Read-only production smoke
    runs-on: ubuntu-latest
    environment: production-smoke
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # T11c (GOV-05): validate BEFORE any smoke network. The dispatch input
      # enters ONLY via step `env:` below — never interpolated into `run:`
      # text. The helper pins it to the exact expected PWA production host
      # (empty/non-https/userinfo/port/path/query/fragment/wrong-host all
      # fail closed) and persists ONLY the sanitized canonical origin to
      # $GITHUB_ENV, so the smoke run below consumes the validated value.
      - name: Validate production_url (fail closed)
        env:
          PRODUCTION_SMOKE_URL: ${{ inputs.production_url }}
        run: |
          node scripts/validate-deploy-origins.mjs --name PRODUCTION_SMOKE_URL --expect pwa --env-file "$GITHUB_ENV"

      - name: Install Playwright browser
        run: pnpm --dir apps/pwa exec playwright install --with-deps chromium

      - name: Run read-only smoke against deployed URL
        env:
          E2E_PRODUCTION_SMOKE: "1"
          E2E_PRODUCTION_URL: ${{ env.PRODUCTION_SMOKE_URL }}
        run: pnpm --dir apps/pwa exec playwright test --config=e2e/playwright.config.ts --project=production-smoke --workers=1 --retries=0
